name: Repository Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Repository Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify version-controlled governance controls
        run: |
          set -euo pipefail
          test -s .github/CODEOWNERS
          test -s .github/branch-protection.main.json
          grep -Fq 'required_approving_review_count' .github/branch-protection.main.json
          grep -Fq 'require_code_owner_reviews' .github/branch-protection.main.json
          grep -Fq 'allow_force_pushes' .github/branch-protection.main.json
      - name: Verify governance and workflow templates have not drifted
        run: |
          set -euo pipefail
          # In the developer-platform repository the installed workflow must
          # stay byte-identical to the distributable template; sibling
          # repositories receive only the installed copy, so the check is
          # skipped there when no template exists.
          if [ -f governance/repository-governance.yml ]; then
            diff -u governance/repository-governance.yml .github/workflows/repository-governance.yml
          fi
          if [ -d ci/github-actions ]; then
            for workflow in baseline reusable-go reusable-python reusable-rust reusable-typescript; do
              diff -u "ci/github-actions/${workflow}.yml" ".github/workflows/${workflow}.yml"
            done
          fi

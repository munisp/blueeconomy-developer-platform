name: Reusable Python Validation
on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: .
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install development dependencies
        run: test -f requirements-dev.txt && pip install -r requirements-dev.txt || true
      - name: Compile sources
        run: test -f pyproject.toml && python -m compileall . || true
      - name: Run pytest suite
        shell: bash
        run: |
          set -euo pipefail
          # Tests must run whenever a test suite exists; skip only when the
          # calling repository genuinely has no pytest suite.
          if ! find . -path ./.git -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            echo 'No pytest suite detected; skipping tests.'
            exit 0
          fi
          python -m pytest --version >/dev/null 2>&1 || python -m pip install pytest
          python -m pytest -x
      - name: Run ruff lint
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ruff.toml && ! -f .ruff.toml ]] && ! grep -q '^\[tool\.ruff' pyproject.toml 2>/dev/null; then
            echo 'No ruff configuration detected; skipping lint.'
            exit 0
          fi
          python -m ruff --version >/dev/null 2>&1 || python -m pip install ruff
          python -m ruff check .
      - name: Run mypy type checks (advisory)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -f mypy.ini && ! -f .mypy.ini ]] && ! grep -qE '^\[tool\.mypy|^\[mypy' pyproject.toml setup.cfg 2>/dev/null; then
            echo 'No mypy configuration detected; skipping type checks.'
            exit 0
          fi
          python -m mypy --version >/dev/null 2>&1 || python -m pip install mypy
          python -m mypy .
      - name: Run bandit security lint
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bandit ]] && ! grep -q '^\[tool\.bandit' pyproject.toml 2>/dev/null && ! grep -rqiE '^bandit([=<> ]|$)' requirements*.txt 2>/dev/null; then
            echo 'No bandit configuration detected; skipping security lint.'
            exit 0
          fi
          python -m bandit --version >/dev/null 2>&1 || python -m pip install bandit
          python -m bandit -r . -x './.venv,./venv,./.git'
      - name: Run pip-audit dependency scan
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f requirements.txt && ! -f pyproject.toml ]]; then
            echo 'No dependency manifest detected; skipping dependency audit.'
            exit 0
          fi
          python -m pip_audit --version >/dev/null 2>&1 || python -m pip install pip-audit
          if [[ -f requirements.txt ]]; then
            python -m pip_audit --requirement requirements.txt --progress-spinner off
          else
            python -m pip_audit --progress-spinner off
          fi
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./${{ inputs.working-directory }}
          format: spdx-json
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          extra_args: --only-verified --fail

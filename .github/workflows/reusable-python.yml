name: Reusable Python Validation
on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: .
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: test -f requirements-dev.txt && pip install -r requirements-dev.txt || true
      - run: test -f pyproject.toml && python -m compileall . || true

name: Reusable Python Validation
on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: .
      requirements-file:
        description: Hash-locked Python dependency file relative to working-directory.
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}
      - name: Verify locked Python dependencies
        run: |
          test -n "${{ inputs.requirements-file }}"
          test -f "${{ inputs.requirements-file }}"
          case "${{ inputs.requirements-file }}" in
            *.lock) ;;
            *) echo 'A hash-locked .lock dependency file is required.' >&2; exit 1 ;;
          esac
          grep -Fq -- '--hash=' "${{ inputs.requirements-file }}" || {
            echo 'Dependency lockfile must contain pip hashes.' >&2
            exit 1
          }
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r "${{ inputs.requirements-file }}"
      - name: Compile Python sources
        run: python -m compileall -q .

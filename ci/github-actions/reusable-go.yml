name: Reusable Go Validation
on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: .
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache: true
      - name: Verify module graph
        run: go mod download
      - name: Run static analysis
        run: go vet ./...
      - name: Run race-enabled tests
        run: go test -race ./...
      - name: Run govulncheck dependency scan
        run: |
          # Pinned release (proxy.golang.org latest as of 2026-08-28); bump deliberately.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./${{ inputs.working-directory }}
          format: spdx-json
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          extra_args: --only-verified --fail

name: Repository Security Baseline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  no-secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./scripts/verify-no-secrets.sh
